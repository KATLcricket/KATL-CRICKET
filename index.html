// ---------- date helpers ----------
const toISO = d => d.toISOString().slice(0, 10);
const fmt = iso => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-IN", {
    weekday: "short",
    day: "numeric",
    month: "short"
  });
};
const fmtShort = iso => {
  const d = new Date(iso + "T00:00:00");
  return {
    dow: d.toLocaleDateString("en-IN", {
      weekday: "short"
    }),
    dom: d.getDate(),
    mon: d.toLocaleDateString("en-IN", {
      month: "short"
    })
  };
};
function upcomingWeekend(offsetWeeks = 0) {
  const now = new Date();
  const day = now.getDay();
  let toSat = (6 - day + 7) % 7;
  if (day === 0) toSat = 6;
  const sat = new Date(now);
  sat.setDate(now.getDate() + toSat + offsetWeeks * 7);
  const sun = new Date(sat);
  sun.setDate(sat.getDate() + 1);
  if (day === 0 && offsetWeeks === 0) {
    const today = new Date(now);
    const yest = new Date(now);
    yest.setDate(now.getDate() - 1);
    return {
      sat: toISO(yest),
      sun: toISO(today)
    };
  }
  return {
    sat: toISO(sat),
    sun: toISO(sun)
  };
}
// Returns the 7 ISO dates Mon..Sun for the week containing today + offsetWeeks.
function weekDays(offsetWeeks = 0) {
  const now = new Date();
  const day = now.getDay(); // 0 Sun .. 6 Sat
  const mondayOffset = day === 0 ? -6 : 1 - day; // back to Monday
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset + offsetWeeks * 7);
  const out = [];
  for (const i of [5, 6]) { // Saturday, Sunday only (KATL plays weekends)
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    out.push(toISO(d));
  }
  return out;
}
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const fmtWhen = ts => {
  if (!ts) return "";
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + "d ago";

    try {
      if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
        toast("This browser doesn't support push. On iPhone, add to Home Screen first.");
        return;
      }
      var perm = await Notification.requestPermission();
      if (perm !== "granted") { toast("Notifications blocked."); return; }
      var reg = await getReg();
      var sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC),
        });
      }
      var player = "";
      try { player = localStorage.getItem("katl:me") || ""; } catch (e) {}
      // Upsert by endpoint
      await fetch(SUPABASE_URL + "/rest/v1/push_subs?on_conflict=endpoint", {
        method: "POST",
        headers: Object.assign(headers(), { "Prefer": "resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify({ endpoint: sub.endpoint, sub: sub, player: player }),
      });
      localStorage.setItem("katl:pushOn", "1");
      render();
      toast("🔔 Notifications enabled!");
    } catch (e) {
      toast("Couldn't enable: " + (e.message || e));
    }
  }

  async function unsubscribe() {
    try {
      var reg = await getReg();
      var sub = reg && (await reg.pushManager.getSubscription());
      if (sub) {
        await fetch(SUPABASE_URL + "/rest/v1/push_subs?endpoint=eq." + encodeURIComponent(sub.endpoint), {
          method: "DELETE", headers: headers(),
        });
        await sub.unsubscribe();
      }
      localStorage.removeItem("katl:pushOn");
      render();
      toast("Notifications turned off.");
    } catch (e) { toast("Error: " + (e.message || e)); }
  }

  async function sendBroadcast() {
    var secret = prompt("Admin send code:");
    if (!secret) return;
    var title = prompt("Notification title:", "KATL Cricket 🏏");
    if (title === null) return;
    var body = prompt("Message:", "Mark your availability for this weekend!");
    if (body === null) return;
    try {
      var r = await fetch(SEND_FN_URL, {
        method: "POST",
        headers: Object.assign(headers(), {}),
        body: JSON.stringify({ title: title, body: body, url: ".", adminSecret: secret }),
      });
      var j = await r.json();
      if (r.ok) toast("Sent to " + (j.sent || 0) + " device(s).");
      else toast("Failed: " + (j.error || r.status));
    } catch (e) { toast("Send error: " + (e.message || e)); }
  }

  function render() {
    var wrap = document.getElementById("katl-push-wrap");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.id = "katl-push-wrap";
      wrap.style.cssText = "position:fixed;bottom:16px;right:16px;z-index:99998;display:flex;flex-direction:column;gap:8px;align-items:flex-end;font-family:sans-serif";
      document.body.appendChild(wrap);
    }
    wrap.innerHTML = "";
    var on = false;
    try { on = localStorage.getItem("katl:pushOn") === "1"; } catch (e) {}

    var btn = document.createElement("button");
    btn.textContent = on ? "🔔 On" : "🔔 Notify me";
    btn.style.cssText = "background:" + (on ? "rgba(74,222,128,.18)" : "linear-gradient(90deg,#FF6B1A,#ff8c42)") + ";color:" + (on ? "#4ADE80" : "#fff") + ";border:1px solid " + (on ? "rgba(74,222,128,.5)" : "transparent") + ";padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer";
    btn.onclick = on ? unsubscribe : subscribe;
    wrap.appendChild(btn);

    var installed = false;
    try { installed = localStorage.getItem("katl:installed") === "1"; } catch (e) {}
    if (!isStandalone() && !installed && (deferredPrompt || isIOS())) {
      var ib = document.createElement("button");
      ib.textContent = "\uD83D\uDCF2 Install app";
      ib.style.cssText = "background:#181818;color:#FF6B1A;border:1px solid rgba(255,107,26,.5);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer";
      ib.onclick = doInstall;
      wrap.appendChild(ib);
    }

    if (isAdmin()) {
      var sb = document.createElement("button");
      sb.textContent = "📢 Send to team";
      sb.style.cssText = "background:#181818;color:#FFB800;border:1px solid rgba(255,107,26,.4);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer";
      sb.onclick = sendBroadcast;
      wrap.appendChild(sb);
    }
  }

  // ---- Home-screen install ----
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    render();
  });
  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    try { localStorage.setItem("katl:installed", "1"); } catch (e) {}
    render();
  });
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }
  function doInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () { deferredPrompt = null; render(); });
    } else if (isIOS()) {
      alert("To install KATL on iPhone:\n\n1. Tap the Share button (□↑) at the bottom of Safari\n2. Scroll down and tap 'Add to Home Screen'\n3. Tap Add\n\nThen open KATL from your home screen.");
    }
  }

  // Register SW + initial render
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){ setTimeout(render, 800); });
  } else { setTimeout(render, 800); }
  // Re-render when admin state may change
  setInterval(render, 4000);
})();


//]]>
</script>
</body>
</html>
